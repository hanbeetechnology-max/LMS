name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        # -b is required: the root tsconfig only references the app and node configs,
        # so a plain `tsc --noEmit` would check nothing.
        run: npx tsc -b --noEmit

      # No e2e test suite exists yet (the old frontend/tests/e2e/portal/ specs were
      # for the pre-Next.js Vite app and no longer apply). Until a real suite is
      # written for the current app, a clean production build is the honest signal
      # that the app actually compiles and every page resolves — real regressions
      # (a broken import, a bad server/client component boundary) fail this step.
      #
      # STAGING_SUPABASE_URL / STAGING_SUPABASE_ANON_KEY are GitHub Actions repo
      # secrets that don't exist yet — they should point at a dedicated staging
      # Supabase project (never production) once one is created. The app is fully
      # client-rendered (no server-side data fetching at build time), so the build
      # succeeds without them; add them once a staging project exists so this step
      # can also smoke-test against a real backend later.
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fails the build if a password, API key or token is committed.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Known-vulnerable packages that ship to users (fails on high or critical).
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
